
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BUILD_INDEX_ON_START=true
      - DATA_DIR=/app/data
      - INDEX_PATH=/app/index.jsonl
      - TOP_K=5
      # - OLLAMA_MODEL=llama3.2:3b
      # - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data
